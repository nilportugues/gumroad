name: E2E

# Runs the Playwright suite (e2e/README.md) against a Rails app booted with the same bin/e2e-up | bin/e2e-run |
# bin/e2e-down flow used locally. It is advisory: nothing requires it, and ci-green.yml does not read it.
#
# Plain `pull_request`, not `pull_request_target`: the suite executes the PR's own code, so it must run without
# secrets. Fork PRs therefore cannot fetch the private Sidekiq gem and are skipped (the job-level `if`).
#
# Not run here: the @stripe spec (e2e/specs/paid-checkout.stripe.spec.ts). It is skipped unless STRIPE_PUBLISHABLE_KEY
# and STRIPE_SECRET_KEY are set, this job never sets them, and a step below says so in the run summary.

on:
  pull_request:
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - "bin/e2e-*"
      - "app/**"
      - "config/**"
      - "db/seeds/**"
      - "db/schema.rb"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright suite
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubicloud-standard-4
    timeout-minutes: 75
    env:
      CI: true
      # Fills the empty gr_bundle volume on a fresh runner (bin/e2e-up refuses to mutate it otherwise).
      E2E_BUNDLE_INSTALL: 1
      # The compose project is named gumroad, so the shared containers are gumroad-db-1 and so on.
      E2E_DYNAMO_CONTAINER: gumroad-dynamodb-1
      BUNDLE_GEMS__CONTRIBSYS__COM: ${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start the shared services
        run: |
          docker compose -p gumroad -f docker/docker-compose-local.yml up -d --wait db redis dynamodb elasticsearch minio
          docker compose -p gumroad -f docker/docker-compose-local.yml up createbuckets
          # `--wait` only waits for services with a healthcheck; MySQL answers on its socket before it listens on TCP.
          for _ in $(seq 1 60); do
            docker exec gumroad-db-1 mysql --protocol=tcp -h127.0.0.1 -uroot -ppassword -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec gumroad-db-1 mysql --protocol=tcp -h127.0.0.1 -uroot -ppassword -e "SELECT 1" >/dev/null
          for _ in $(seq 1 60); do
            docker exec gumroad-elasticsearch-1 curl -fsS http://localhost:9200/_cluster/health >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec gumroad-elasticsearch-1 curl -fsS http://localhost:9200/_cluster/health >/dev/null

      - name: Boot the app and seed it
        run: bin/e2e-up

      - name: Run the suite
        run: bin/e2e-run

      - name: Note the skipped Stripe spec
        if: always()
        run: |
          echo "paid-checkout.stripe.spec.ts is skipped: this job has no Stripe test keys (STRIPE_PUBLISHABLE_KEY, STRIPE_SECRET_KEY)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect the report, traces and screenshots
        if: always()
        run: docker cp gr-e2e-lane3:/work/e2e/.out ./e2e-out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e-out
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the app and remove its data
        if: always()
        run: bin/e2e-down
